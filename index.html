<!DOCTYPE html>
<html>

<head>

    <title>AI Movie Recommendation System</title>

    <style>

        body{
            background-color:#141414;
            font-family:Arial, Helvetica, sans-serif;
            color:white;
            margin:0;
            padding:0;
        }

        .container{
            width:90%;
            margin:auto;
            margin-top:40px;
            text-align:center;
        }

        h1{
            color:#e50914;
            font-size:55px;
            margin-bottom:30px;
        }

        form{
            background:#1f1f1f;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.5);
            margin-bottom:40px;
        }

        input{
            width:80%;
            padding:15px;
            margin:10px;
            border:none;
            border-radius:10px;
            font-size:18px;
            outline:none;
        }

        button{
            background:#e50914;
            color:white;
            border:none;
            padding:15px 40px;
            font-size:20px;
            border-radius:10px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#ff1e28;
            transform:scale(1.05);
        }

        .recommendations{
            margin-top:40px;
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
        }

        .movie-card{

            background:#222;
            margin:15px;
            padding:20px;
            border-radius:15px;
            width:250px;
            transition:0.3s;
            box-shadow:0px 0px 15px rgba(0,0,0,0.5);

        }

        .movie-card:hover{
            transform:scale(1.05);
            background:#333;
        }

        .movie-card img{
            width:100%;
            height:350px;
            object-fit:cover;
            border-radius:10px;
        }

        .movie-card h3{
            margin-top:15px;
            font-size:20px;
            color:#ffffff;
        }

        .movie-card p{
            font-size:18px;
            color:#ffd700;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🎬 AI Movie Recommendation System</h1>

        <form method="POST">

            <input
                type="text"
                name="userID"
                placeholder="Enter User ID"
                required
            >

            <br>

            <input
                type="text"
                name="movie_name"
                placeholder="Enter Movie Name"
                required
            >

            <br><br>

            <button type="submit">
                Recommend Movies
            </button>

        </form>

        <div class="recommendations">

            {% for movie in recommendations %}

            <div class="movie-card">

                <img
                    src="{{ movie.poster }}"
                    alt="Movie Poster"
                >

                <h3>{{ movie.title }}</h3>

                <p>
                    ⭐ Predicted Rating:
                    {{ movie.rating }}
                </p>

            </div>

            {% endfor %}

        </div>

    </div>

</body>

</html>
